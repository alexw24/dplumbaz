name: IndexNow ping

# Notifies IndexNow-participating search engines (Bing, Yandex, Naver, Seznam)
# whenever main is updated. Bing's index feeds ChatGPT search — this is the
# GEO channel. Key is public by design (verified via the static/{key}.txt file).

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deploy
        run: sleep 90

      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY="7c0086d5ba37ce5c262b28eab0d0e1fb77febf624f7ee2bdf70a76d9ef2c2ff9"
          HOST="dplumbaz.com"

          # Key file must be live before engines can verify the ping
          KEYCHECK=$(curl -s -o /dev/null -w '%{http_code}' "https://${HOST}/${KEY}.txt")
          if [ "$KEYCHECK" != "200" ]; then
            echo "Key file not reachable (HTTP ${KEYCHECK}) — deploy may still be running. Failing so the run is visible."
            exit 1
          fi

          curl -s "https://${HOST}/sitemap.xml" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed 's/<[^>]*>//g' \
            | jq -R . | jq -s \
                --arg host "$HOST" \
                --arg key "$KEY" \
                '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: .}' \
            > payload.json

          echo "Submitting $(jq '.urlList | length' payload.json) URLs"
          STATUS=$(curl -s -o response.txt -w '%{http_code}' \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @payload.json)
          echo "IndexNow HTTP ${STATUS}"
          cat response.txt
          # 200 = OK, 202 = accepted (key validation pending) — both are success
          [ "$STATUS" = "200" ] || [ "$STATUS" = "202" ]
