<section class="relative bg-brand-heading text-white py-24 text-center overflow-hidden">

  {{ partial "hero-picture.html" . }}

  <div class="relative mx-auto max-w-4xl px-4">
    <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold leading-tight tracking-tight mb-4">
      {{ .Title }}
    </h1>

    {{ with .Params.hero_subtitle }}
    <p class="text-lg sm:text-xl text-brand-surface mb-8 max-w-2xl mx-auto">{{ . }}</p>
    {{ end }}

    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <a href="{{ .Params.hero_cta_primary_url | default "/contact/" }}"
         class="inline-block border-2 border-white text-white hover:bg-white hover:text-brand-heading font-semibold rounded px-6 py-3 transition-colors">
        {{ .Params.hero_cta_primary_text | default "Request a Service" }}
      </a>
      <a href="tel:{{ .Site.Params.phoneRaw }}"
         class="inline-block bg-brand-cta hover:bg-brand-cta-hover text-white font-bold rounded px-6 py-3 transition-colors">
        Call Us Now!
      </a>
    </div>
  </div>
</section>
